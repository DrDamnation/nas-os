[Service]
# Come su ADM: niente etichette SELinux sui container (i compose di ADM non usano :z,
# con SELinux attivo i container non leggerebbero i dati del RAID). Il sistema resta Enforcing.
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --userland-proxy-path /usr/bin/docker-proxy --init-path /usr/bin/tini-static

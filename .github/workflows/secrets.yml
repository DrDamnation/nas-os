name: controllo segreti
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scanner nostro (segreti + dati personali)
        env:
          SECRETS_SCAN_EXTRA: ${{ secrets.SECRETS_SCAN_EXTRA }}
        run: bash tests/secrets-scan.sh
      - name: gitleaks su tutto lo storico
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner .
